<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pradex Finanças — organização financeira com conta e agente no WhatsApp</title>

    <!-- Até 14/09/2026 esta página tinha SÓ o <title>. Sem description, sem Open
         Graph, sem nada. O app vive atrás do login e crawler não faz login, então a
         IA de busca do Google não tinha o que ler: descreveu o Pradex como "projeto
         de portfólio" que guarda dados no localStorage e recomendou não inserir
         informação real. Errado em tudo que dá pra verificar — mas era o único
         palpite possível com zero material.
         Estas tags e a /sobre existem pra dar a ela o que citar. -->
    <meta name="description" content="Registre gastos pelo app ou pelo WhatsApp e acompanhe para onde o dinheiro vai. Seus lançamentos ficam na sua conta, em servidor — não no navegador. Feito por Lucas D'Angelo Pradella, Nobel Capital." />
    <link rel="canonical" href="https://pradex.com.br/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pradex Finanças" />
    <meta property="og:title" content="Pradex Finanças — organização financeira com conta e agente no WhatsApp" />
    <meta property="og:description" content="Lance gastos por texto ou áudio no WhatsApp. Teto por categoria, cartões, parcelas futuras e score de disciplina." />
    <meta property="og:url" content="https://pradex.com.br/" />
    <meta property="og:image" content="https://pradex.com.br/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <meta name="theme-color" content="#0C0E14" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pradex" />

    <!-- O app inteiro pede 'DM Sans' (App.jsx e os componentes desktop), mas a fonte
         nunca era carregada: sem @font-face, sem pacote, sem link. Todo texto caía
         no fallback 'Helvetica Neue' — que não existe em Windows nem Android — e de
         lá em Arial/Roboto. Os pesos são os que o código usa: 400/500/600/700. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
    />

    <style>
      /* O <body> não tinha estilo nenhum: margem padrão do user-agent e fonte
         herdada do navegador. A raiz do React define a sua própria fonte, mas o
         fundo do body aparecia branco por baixo em overscroll no iOS. */
      html, body { background: #0C0E14; }
      body {
        margin: 0;
        font-family: 'DM Sans', 'Helvetica Neue', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Acima do breakpoint do shell desktop (1024px) o app é claro — um body
         escuro piscaria antes do React montar. Mesmo valor de desktopTheme.mainBg. */
      @media (min-width: 1024px) {
        html, body { background: #F1F3F9; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
